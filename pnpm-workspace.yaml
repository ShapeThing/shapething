packages:
  - 'apps/*'
  - 'packages/*'
  # Standalone submodule (npm, consumes published @shapething/* packages); its unpatched
  # shacl-engine@1.0.2 would collide with patches/shacl-engine@1.0.2.patch.
  - '!apps/app.shapething.com'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
minimumReleaseAgeExclude:
  - maplibre-gl-geo-editor@0.11.0
packageExtensions:
  shacl-engine@1.0.2:
    dependencies:
      '@comunica/query-sparql': ^4.5.0
patchedDependencies:
  shacl-engine@1.0.2: patches/shacl-engine@1.0.2.patch
