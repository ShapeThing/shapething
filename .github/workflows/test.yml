name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser-mode Vitest projects (shacl-everything's and shacl-manager's Storybook interaction
      # tests) run in headless Chromium. Each package pins its own Playwright version, and each
      # version needs its own matching browser build, so install through each package's own CLI.
      - name: Install Playwright Chromium
        run: |
          pnpm --filter @shapething/shacl-everything exec playwright install --with-deps chromium
          pnpm --filter @shapething/shacl-manager exec playwright install --with-deps chromium

      # turbo.json's test task depends on ^build, so workspace dependencies (resource-fetcher's
      # dist for shacl-everything's Storybook fixtures, shacl-everything's dist for shacl-manager)
      # are built first. --concurrency=1 keeps the two browser-mode suites from running headless
      # Chromium side by side: together they exhausted the runner's memory and the page crashed
      # mid-run ("Browser connection was closed while running tests").
      - name: Run tests
        run: pnpm exec turbo run test --concurrency=1
        env:
          CI: true
          # Playwright's browser-process log: when headless Chromium dies mid-run ("Browser
          # connection was closed while running tests"), this records why (OOM kill, renderer crash).
          DEBUG: pw:browser
