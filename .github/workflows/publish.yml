name: Publish
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # apps/app.shapething.com is a private submodule. The deploy key only grants access to
      # ShapeThing/app, so it is used for this fetch alone, not for the main checkout.
      - name: Checkout private app submodule
        env:
          APP_DEPLOY_KEY: ${{ secrets.APP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$APP_DEPLOY_KEY" > ~/.ssh/app_deploy_key
          chmod 600 ~/.ssh/app_deploy_key
          GIT_SSH_COMMAND="ssh -i ~/.ssh/app_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git submodule update --init apps/app.shapething.com

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update npm for OIDC trusted publishing support
        run: npm install -g npm@latest

      - name: Create release PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish to npm via OIDC
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm run release
