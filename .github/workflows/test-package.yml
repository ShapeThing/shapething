name: Test package

# Reusable workflow: each package has its own test-<package>.yml that calls this one, so every
# package gets its own status badge.
on:
  workflow_call:
    inputs:
      package:
        description: The package's name, as passed to --filter.
        required: true
        type: string
      browser:
        description: Whether the package has browser-mode Vitest projects that need Chromium.
        type: boolean
        default: false
      shards:
        description: Run the tests in this many shards, each in a fresh browser. 0 disables sharding.
        type: number
        default: 0
      badge:
        description: The badge file's name on the badges branch, without .json.
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # apps/app.shapething.com is a private submodule. The deploy key only grants access to
      # ShapeThing/app, so it is used for this fetch alone, not for the main checkout.
      - name: Checkout private app submodule
        env:
          APP_DEPLOY_KEY: ${{ secrets.APP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$APP_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/app_deploy_key
          chmod 600 ~/.ssh/app_deploy_key
          ssh-keygen -y -f ~/.ssh/app_deploy_key > /dev/null \
            || { echo "::error::APP_DEPLOY_KEY secret is not a valid OpenSSH private key"; exit 1; }
          GIT_SSH_COMMAND="ssh -i ~/.ssh/app_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git submodule update --init apps/app.shapething.com

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser-mode Vitest projects (Storybook interaction tests) run in headless Chromium. Each
      # package pins its own Playwright version, and each version needs its own matching browser
      # build, so install through the package's own CLI.
      - name: Install Playwright Chromium
        if: inputs.browser
        run: pnpm --filter ${{ inputs.package }} exec playwright install --with-deps chromium

      # turbo.json's test task depends on ^build, so workspace dependencies (resource-fetcher's
      # dist for shacl-renderer's Storybook fixtures, shacl-renderer's dist for shacl-manager)
      # are built first.
      - name: Run tests
        if: inputs.shards == 0
        run: |
          mkdir -p $RUNNER_TEMP/results
          pnpm exec turbo run test --filter=${{ inputs.package }} -- \
            --reporter=default --reporter=json --outputFile.json=$RUNNER_TEMP/results/results.json
        env:
          CI: true

      # shacl-renderer's Storybook suite runs in shards, each in a fresh browser. Past ~50 heavy
      # story files in one page, that page stops processing network responses (requests complete
      # in the network service but never resolve in the page) and the run hangs until Vitest
      # reports "Browser connection was closed while running tests". Sharding keeps each page
      # well under that. Every shard runs even after one fails, so the badge counts the whole suite.
      - name: Run tests in shards
        if: inputs.shards > 0
        run: |
          mkdir -p $RUNNER_TEMP/results
          pnpm exec turbo run build --filter='${{ inputs.package }}^...'
          status=0
          for shard in $(seq 1 ${{ inputs.shards }}); do
            pnpm --filter ${{ inputs.package }} exec vp test --shard=$shard/${{ inputs.shards }} \
              --reporter=default --reporter=json --outputFile.json=$RUNNER_TEMP/results/shard-$shard.json || status=1
          done
          exit $status
        env:
          CI: true
          # Playwright's browser-process log: when headless Chromium dies mid-run ("Browser
          # connection was closed while running tests"), this records why (OOM kill, renderer crash).
          DEBUG: pw:browser

      # Counts the tests in the Vitest JSON reports (one per shard) into shields.io endpoint files,
      # so the badges show counts rather than only passing/failing: <badge>.json for all tests, and
      # <badge>-unit.json and <badge>-storybook.json split by whether the test file is a story. No
      # report at all means the run broke before or during the tests.
      - name: Write badges
        if: always()
        run: |
          mkdir -p $RUNNER_TEMP/badge
          shopt -s nullglob
          reports=($RUNNER_TEMP/results/*.json)
          for kind in all unit storybook; do
            file=$RUNNER_TEMP/badge/${{ inputs.badge }}$([ $kind = all ] || echo "-$kind").json
            label=$([ $kind = all ] && echo tests || echo "$kind tests")
            if [ ${#reports[@]} -eq 0 ]; then
              message=error color=red
            else
              read passed failed skipped < <(jq -rs --arg kind $kind '
                [.[].testResults[]
                  | select($kind == "all" or ((.name | test("\\.stories\\.")) == ($kind == "storybook")))
                  | .assertionResults[].status]
                | [(map(select(. == "passed")) | length),
                   (map(select(. == "failed")) | length),
                   (map(select(. != "passed" and . != "failed")) | length)]
                | @tsv' "${reports[@]}")
              message="$passed passed"
              [ "$failed" -gt 0 ] && message="$message, $failed failed"
              [ "$skipped" -gt 0 ] && message="$message, $skipped skipped"
              color=$([ "$failed" -gt 0 ] && echo red || echo brightgreen)
            fi
            jq -n --arg label "$label" --arg message "$message" --arg color "$color" \
              '{schemaVersion: 1, $label, $message, $color}' > $file
            echo "$(basename $file): $message"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: badge
          path: ${{ runner.temp }}/badge

  # Publishes the badge files to the badges branch, which the READMEs' badges read through
  # shields.io. Only main's results count, and only this job can write, so the test job (which
  # runs pull request code) keeps a read-only token.
  badge:
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: badge
          path: badge

      # Every package's workflow pushes here at about the same time. Each writes only its own
      # files, so a rejected push is retried on top of the new branch head.
      - name: Push to badges branch
        run: |
          git init -q repo && cd repo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth=1 origin badges; then
              git checkout -q -B badges FETCH_HEAD
            else
              git checkout -q --orphan badges
            fi
            cp ../badge/*.json .
            git add *.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Update ${{ inputs.badge }} badges"
            git push -q origin badges && exit 0
            sleep $((attempt * 2))
          done
          exit 1
